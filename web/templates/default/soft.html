{% extends "layout.html" %}
{% block content %}

<!-- 页面标题和搜索 -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold text-gray-800">软件管理</h1>
    <div class="flex items-center gap-3">
        <div class="relative">
            <input type="text" id="SearchValue" 
                class="input w-64 pl-10" 
                placeholder="搜索软件...">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
        <button class="btn btn-primary" onclick="importPluginOpen()">
            <i class="fa-solid fa-plus mr-2"></i>添加插件
        </button>
        <input type="file" style="display:none;" accept=".zip,.tar.gz" id="update_zip" multiple="multiple">
    </div>
</div>

<!-- 分类标签 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="flex px-5 py-3 gap-4 overflow-x-auto no-scrollbar" id="soft-categories">
        <button class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600" data-type="all">全部</button>
    </div>
</div>

<!-- 软件列表 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="overflow-x-auto">
        <table class="data-table">
            <thead>
                <tr>
                    <th>软件名称</th>
                    <th>说明</th>
                    <th class="text-center">位置</th>
                    <th class="text-center">状态</th>
                    <th class="text-center">首页显示</th>
                    <th class="text-right">操作</th>
                </tr>
            </thead>
            <tbody id="softList">
                <!-- 动态加载 -->
            </tbody>
        </table>
    </div>
    
    <!-- 分页 -->
    <div class="px-5 py-4 border-t border-gray-100 flex justify-between items-center">
        <div class="text-sm text-gray-500" id="soft-info">共 0 个软件</div>
        <div id="softPage" class="flex gap-1"></div>
    </div>
</div>

<script type="text/javascript" src="/static/js/jquery.dragsort-0.5.2.min.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/laydate/laydate.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/app/soft.js?v={{config.version}}"></script>
<script>
getSList();

// 搜索防抖
var searchTimer;
$('#SearchValue').on('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
        getSList();
    }, 300);
});
</script>
{% endblock %}
