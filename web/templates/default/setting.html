{% extends "layout.html" %}
{% block content %}

<!-- 页面标题 -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold text-gray-800">面板设置</h1>
</div>

<!-- 快捷设置 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="p-5 flex flex-wrap items-center gap-6">
        <div class="flex items-center gap-3">
            <span class="text-sm text-gray-600">关闭面板</span>
            <div class="switch {% if data['admin_close'] == 'yes' %}active{% endif %}" onclick="closePanel()"></div>
        </div>
        <div class="flex items-center gap-3 border-l border-gray-200 pl-6">
            <span class="text-sm text-gray-600">开发模式</span>
            <div class="switch {% if data['debug'] == 'open' %}active{% endif %}" onclick="debugMode()"></div>
        </div>
        <div class="flex items-center gap-3 border-l border-gray-200 pl-6">
            <span class="text-sm text-gray-600" title="开启后允许使用ipv6访问面板">监听IPv6</span>
            <div class="switch {{data['ipv6']}}" onclick="setIPv6()"></div>
        </div>
    </div>
</div>

<!-- 基本设置 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="px-5 py-3 border-b border-gray-100">
        <h3 class="font-medium text-gray-600">基本设置</h3>
    </div>
    <div class="p-5">
        <!-- 提示 -->
        <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-6 flex items-start gap-3">
            <i class="fa-solid fa-circle-exclamation text-amber-500 mt-0.5"></i>
            <p class="text-sm text-amber-700">为了提高安全，请修改面板密码！</p>
        </div>
        
        <div class="space-y-5">
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">别名</label>
                <input id="webname" name="webname" class="input w-64" value="{{data['title']}}">
                <button class="btn btn-primary btn-sm" onclick="saveWebName()">保存</button>
                <span class="text-xs text-gray-500">面板名称</span>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">服务器IP</label>
                <input name="host_ip" class="input w-64" value="{{data['ip']}}">
                <button class="btn btn-primary btn-sm" onclick="saveHostIp()">保存</button>
                <span class="text-xs text-gray-500">默认为外网IP</span>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">面板端口</label>
                <input id="banport" name="port" class="input w-32 text-center" type="number" value="{{data['port']}}" data-port="{{data['port']}}">
                <button class="btn btn-primary btn-sm" onclick="savePort()">保存</button>
                <span class="text-xs text-gray-500">建议端口范围 7200 - 65535</span>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">安全入口</label>
                <input id="admin_path" name="admin_path" class="input w-64" value="{{data['admin_path']}}">
                <button class="btn btn-primary btn-sm" onclick="modifyAuthPath()">设置</button>
                <span class="text-xs text-gray-500">如: /abc</span>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">默认建站目录</label>
                <input name="sites_path" class="input w-64" value="{{data['site_path']}}">
                <button class="btn btn-primary btn-sm" onclick="saveSitesPath()">保存</button>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">默认备份目录</label>
                <input name="backup_path" class="input w-64" value="{{data['backup_path']}}">
                <button class="btn btn-primary btn-sm" onclick="saveBackupPath()">保存</button>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">服务器时间</label>
                <input id="systemdate" name="systemdate" class="input w-64" value="{{data['systemdate']}}" disabled>
                <button class="btn btn-primary btn-sm" onclick="setTimezone()">设置</button>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">面板用户</label>
                <input name="username_" class="input w-64" value="{{data['username']}}" disabled>
                <button class="btn btn-primary btn-sm" onclick="setUserName()">设置</button>
            </div>
            
            <div class="flex items-center gap-4">
                <label class="w-32 text-sm text-gray-600 text-right">面板密码</label>
                <input name="password_" class="input w-64" value="******" disabled>
                <button class="btn btn-primary btn-sm" onclick="setPassword()">设置</button>
            </div>
        </div>
    </div>
</div>

<!-- 安全设置 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="px-5 py-3 border-b border-gray-100">
        <h3 class="font-medium text-gray-600">安全设置</h3>
    </div>
    <div class="p-5 space-y-5">
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">绑定域名</label>
            <input name="bind_domain" class="input w-64" value="{{data['panel_domain']}}">
            <button class="btn btn-primary btn-sm" onclick="saveBindDomain()">保存</button>
            <span class="text-xs text-red-500">注意：绑定后只能通过域名访问</span>
        </div>
        
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">面板SSL</label>
            <div class="switch {% if data['panel_ssl']['open'] %}active{% endif %}" id="cfg_ssl" onclick="togglePanelSSL()"></div>
            <button class="btn btn-outline btn-sm" onclick="getPanelSSL()">SSL配置</button>
            <span class="text-xs text-gray-500">提升面板访问安全性</span>
        </div>
        
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">BasicAuth认证</label>
            <div class="switch {% if data['basic_auth']['open'] %}active{% endif %}" id="cfg_basic_auth" onclick="setBasicAuth()"></div>
            <span class="text-xs text-gray-500">防止面板被扫描</span>
        </div>
        
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">API接口</label>
            <div class="switch {% if data['panel_api']['open'] %}active{% endif %}" id="cfg_panel_api" onclick="setPanelApi()"></div>
            <button class="btn btn-outline btn-sm" onclick="appPage()">APP管理</button>
        </div>
        
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">未认证响应</label>
            <input name="status_code" class="input w-32" value="{{data['unauthorized_status']['text']}}" disabled>
            <button class="btn btn-primary btn-sm" data-code="{{data['unauthorized_status']['code']}}" onclick="setStatusCode(this)">设置</button>
        </div>
        
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">二步验证</label>
            <div class="switch {% if data['two_step_verification']['open'] %}active{% endif %}" id="cfg_panel_auth" onclick="setAuthSecretApi()"></div>
            <button class="btn btn-outline btn-sm" onclick="setAuthBind()">绑定设置</button>
        </div>
    </div>
</div>

<!-- 通知设置 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="px-5 py-3 border-b border-gray-100">
        <h3 class="font-medium text-gray-600">通知设置</h3>
    </div>
    <div class="p-5 space-y-5">
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">TG机器人</label>
            <div class="switch {% if data['notify_tgbot']['open'] %}active{% endif %}" id="cfg_tgbot" onclick="setNotifyTgbot(this)"></div>
            <button class="btn btn-outline btn-sm" onclick="getTgbot()">配置</button>
            <span class="text-xs text-red-500">国内可能无法使用</span>
        </div>
        
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">邮件通知</label>
            <div class="switch {% if data['notify_email']['open'] %}active{% endif %}" id="cfg_email" onclick="setNotifyEmail(this)"></div>
            <button class="btn btn-outline btn-sm" onclick="getEmailCfg()">配置</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/app/config.js?v={{config.version}}"></script>
{% endblock %}
