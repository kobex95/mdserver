{% extends "layout.html" %}
{% block content %}

<!-- 页面标题 -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold text-gray-800">日志管理</h1>
</div>

<!-- 标签页 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="flex px-5 py-3 border-b border-gray-100 gap-6 tabs">
        <div class="tab-item active" data-tab="panelLogs">面板日志</div>
        <div class="tab-item" data-tab="logAudit">日志审计</div>
    </div>
</div>

<!-- 面板日志 -->
<div class="tab-content" id="panelLogs-content">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="p-4 border-b border-gray-100 flex gap-3">
            <button class="btn btn-success" onclick="refreshLogs()">
                <i class="fa-solid fa-rotate-right mr-2"></i>刷新日志
            </button>
            <button class="btn btn-danger" onclick="clearLogs()">
                <i class="fa-solid fa-trash mr-2"></i>清空日志
            </button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="data-table" id="operationLog">
                <thead>
                    <tr>
                        <th width="80">编号</th>
                        <th width="120">操作类型</th>
                        <th>详情</th>
                        <th width="160">操作时间</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 动态加载 -->
                </tbody>
            </table>
        </div>
        
        <div class="px-5 py-4 border-t border-gray-100 flex justify-between items-center">
            <div class="text-sm text-gray-500" id="log-count">共 0 条</div>
            <div class="page" id="logPage"></div>
        </div>
    </div>
</div>

<!-- 日志审计 -->
<div class="tab-content hidden" id="logAudit-content">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="flex">
            <!-- 左侧文件列表 -->
            <div class="w-64 border-r border-gray-200 min-h-96">
                <div class="p-3 border-b border-gray-100">
                    <span class="text-sm font-medium text-gray-600">日志文件</span>
                </div>
                <div id="logAuditFiles" class="overflow-y-auto max-h-96">
                    <!-- 动态加载 -->
                </div>
            </div>
            
            <!-- 右侧内容 -->
            <div class="flex-1">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                    <button class="btn btn-success" onclick="refreshAuditLog()">
                        <i class="fa-solid fa-rotate-right mr-2"></i>刷新
                    </button>
                    <div class="relative">
                        <input type="text" id="auditSearch" class="input w-64 pl-10 text-sm" placeholder="搜索...">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="data-table" id="logAuditTable">
                        <thead>
                            <tr>
                                <th>用户</th>
                                <th>来源</th>
                                <th>端口</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="px-5 py-4 border-t border-gray-100 flex justify-end">
                    <div class="page" id="auditPage"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/app/logs.js?v={{config.version}}"></script>
<script>
// 标签页切换
$('.tab-item').click(function() {
    var tab = $(this).data('tab');
    $('.tab-item').removeClass('active');
    $(this).addClass('active');
    $('.tab-content').addClass('hidden');
    $('#' + tab + '-content').removeClass('hidden');
});
</script>
{% endblock %}
