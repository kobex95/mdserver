{% extends "layout.html" %}
{% block content %}

<!-- 页面标题 -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold text-gray-800">计划任务</h1>
</div>

<!-- 添加任务 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="px-5 py-3 border-b border-gray-100">
        <h3 class="font-medium text-gray-600">添加计划任务</h3>
    </div>
    <div class="p-5 space-y-5">
        <!-- 任务类型 -->
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">任务类型</label>
            <select id="taskType" class="input w-48">
                <option value="toShell">Shell脚本</option>
                <option value="site">备份网站</option>
                <option value="database">备份数据库</option>
                {% for db in data['hook_database'] %}
                <option value="database_{{db['name']}}">备份数据库【{{db['title']}}】</option>
                {% endfor %}
                <option value="path">备份目录</option>
                <option value="logs">日志切割</option>
                <option value="rememory">释放内存</option>
                <option value="toUrl">访问URL</option>
            </select>
        </div>
        
        <!-- 任务名称 -->
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">任务名称</label>
            <input type="text" name="name" class="input w-64" placeholder="请输入任务名称">
        </div>
        
        <!-- 执行周期 -->
        <div class="flex items-center gap-4">
            <label class="w-32 text-sm text-gray-600 text-right">执行周期</label>
            <select id="cycleType" class="input w-32">
                <option value="day">每天</option>
                <option value="day-n">N天</option>
                <option value="hour">每小时</option>
                <option value="hour-n">N小时</option>
                <option value="minute-n">N分钟</option>
                <option value="week" selected>每星期</option>
                <option value="month">每月</option>
            </select>
            
            <div id="cycleConfig" class="flex items-center gap-3">
                <select id="weekDay" class="input w-24">
                    <option value="1">周一</option>
                    <option value="2">周二</option>
                    <option value="3">周三</option>
                    <option value="4">周四</option>
                    <option value="5">周五</option>
                    <option value="6">周六</option>
                    <option value="0">周日</option>
                </select>
                <input type="number" name="hour" class="input w-20 text-center" value="1" min="0" max="23">
                <span class="text-sm text-gray-500">小时</span>
                <input type="number" name="minute" class="input w-20 text-center" value="30" min="0" max="59">
                <span class="text-sm text-gray-500">分钟</span>
            </div>
        </div>
        
        <!-- 脚本内容 -->
        <div class="flex items-start gap-4">
            <label class="w-32 text-sm text-gray-600 text-right pt-2">脚本内容</label>
            <textarea name="sbody" class="input w-full h-32 font-mono text-sm" placeholder="请输入脚本内容..."></textarea>
        </div>
        
        <!-- 提交 -->
        <div class="flex items-center gap-4">
            <label class="w-32"></label>
            <button class="btn btn-success" onclick="planAdd()">
                <i class="fa-solid fa-plus mr-2"></i>添加任务
            </button>
        </div>
        
        <!-- 提示 -->
        <div class="flex items-start gap-4">
            <label class="w-32"></label>
            <div class="text-xs text-gray-500 space-y-1">
                <p>• 当添加完备份任务，应该手动运行一次，并检查备份包是否完整</p>
                <p>• 磁盘容量不够、数据库密码错误、网络不稳定等原因，可能导致数据备份不完整</p>
            </div>
        </div>
    </div>
    
    <!-- 隐藏表单 -->
    <form id="cronConfig" action="/crontab/add" enctype="multipart/form-data" method="post" style="display: none;">
        <input type="text" name="name" value="">
        <input type="text" name="type" value="">
        <input type="number" name="where1" value="">
        <input type="number" name="hour" value="">
        <input type="number" name="minute" value="">
        <input type="text" name="week" value="">
        <input type="text" name="stype" value="">
        <textarea name='sbody'></textarea>
        <input id="sfile" type="file" name="sfile" value="">
        <input type="text" name="sname" value="">
        <input id="backup_to" type="text" name="backup_to" value="localhost">
        <input id="url_address" type="text" name="url_address" value="">
        <input id="attr" type="text" name="attr" value="">
        <input type="number" name="save" value="">
        <input type="submit">
    </form>
</div>

<!-- 任务列表 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center">
        <h3 class="font-medium text-gray-600">任务列表</h3>
        <button id="allDelete" class="btn btn-danger btn-sm hidden" onclick="allDeleteCron()">
            <i class="fa-solid fa-trash mr-2"></i>删除选中
        </button>
    </div>
    
    <div class="overflow-x-auto">
        <table class="data-table">
            <thead>
                <tr>
                    <th width="40" class="text-center">
                        <input type="checkbox" onclick="checkSelect();" id="setBox" class="w-4 h-4">
                    </th>
                    <th>任务名称</th>
                    <th width="80" class="text-center">状态</th>
                    <th>周期</th>
                    <th>执行时机</th>
                    <th width="80" class="text-center">保存数量</th>
                    <th width="100">备份到</th>
                    <th width="140">添加时间</th>
                    <th width="180" class="text-right">操作</th>
                </tr>
            </thead>
            <tbody id="cronbody">
                <!-- 动态加载 -->
            </tbody>
        </table>
    </div>
    
    <div class="px-5 py-4 border-t border-gray-100 flex justify-end">
        <div id="cronPage" class="flex gap-1"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/app/crontab.js?v={{config.version}}"></script>
<script>
toWeek();
toHour();
toMinute();
toShell();
getCronData(1);
</script>
{% endblock %}
