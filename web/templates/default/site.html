{% extends "layout.html" %}
{% block content %}

<!-- 页面标题和操作按钮 -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold text-gray-800">网站管理</h1>
    <div class="flex items-center gap-3">
        <div class="relative">
            <input type="text" id="site_search_input" 
                class="input w-64 pl-10" 
                placeholder="搜索网站..." autocomplete="off">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
    </div>
</div>

<!-- 提示信息 -->
<div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-6 flex items-start gap-3">
    <i class="fa-solid fa-circle-exclamation text-amber-500 mt-0.5"></i>
    <p class="text-sm text-amber-700">创建站点时会自动创建权限配置，统一使用 www 用户。</p>
</div>

<!-- 操作按钮 -->
<div class="flex flex-wrap gap-3 mb-6">
    <button onclick="webAdd(0)" class="btn btn-success">
        <i class="fa-solid fa-plus mr-2"></i>添加站点
    </button>
    <button onclick="siteDefaultPage();" class="btn btn-outline">
        <i class="fa-solid fa-file-code mr-2"></i>修改默认页
    </button>
    <button onclick="getDefaultSite();" class="btn btn-outline">
        <i class="fa-solid fa-star mr-2"></i>默认站点
    </button>
    <button onclick="setClassType();" class="btn btn-outline">
        <i class="fa-solid fa-folder mr-2"></i>分类管理
    </button>
    <button onclick="setPHPVer();" class="btn btn-outline">
        <i class="fa-brands fa-php mr-2"></i>PHP命令行版本
    </button>
    <button id="batch-delete-btn" batch="true" style="display:none;" onclick="allDeleteSite();" class="btn btn-danger ml-auto">
        <i class="fa-solid fa-trash mr-2"></i>删除选中
    </button>
</div>

<!-- 网站列表 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="overflow-x-auto">
        <table class="data-table">
            <thead>
                <tr>
                    <th width="40" class="text-center">
                        <input type="checkbox" onclick="checkSelect();" id="setBox" class="w-4 h-4">
                    </th>
                    <th width="180">域名</th>
                    <th width="100" class="text-center">状态</th>
                    <th width="80" class="text-center">备份</th>
                    <th>网站目录</th>
                    <th width="100">到期日期</th>
                    <th width="120">备注</th>
                    <th width="150" class="text-right">操作</th>
                </tr>
            </thead>
            <tbody id="webBody">
                <!-- 动态加载 -->
            </tbody>
        </table>
    </div>
    
    <!-- 分页和分类 -->
    <div class="px-5 py-4 border-t border-gray-100 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <span class="text-sm text-gray-500">站点分类:</span>
            <select class="input w-32 text-sm" id="site_class_select">
                <option value="-1">全部分类</option>
                <option value="0">默认分类</option>
            </select>
        </div>
        <div id="webPage" class="flex gap-1"></div>
    </div>
</div>

<script type="text/javascript" src="/static/laydate/laydate.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/app/site.js?v={{config.version}}"></script>
<script>
setTimeout(function(){ getWeb(1); }, 500);

// 搜索防抖
var searchTimer;
$('#site_search_input').on('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
        getWeb(1);
    }, 300);
});
</script>
{% endblock %}
