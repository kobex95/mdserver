{% extends "layout.html" %}
{% block content %}

<!-- 页面标题 -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold text-gray-800">系统监控</h1>
</div>

<!-- 设置面板 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="p-5 flex flex-wrap items-center gap-6">
        <div class="flex items-center gap-3">
            <span class="text-sm text-gray-600">开启监控</span>
            <div class="switch" id="openJK" onclick="toggleMonitor()"></div>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-sm text-gray-600">保存天数:</span>
            <input type="number" id="save_day" class="input w-20 text-center" value="30">
            <button class="btn btn-outline text-sm" onclick="setControl('save_day', true);">更改</button>
        </div>
        <div class="flex items-center gap-3 border-l border-gray-200 pl-6">
            <span class="text-sm text-gray-600">仅统计外网</span>
            <div class="switch" id="statAll" onclick="toggleStatAll()"></div>
        </div>
        <button class="btn btn-danger text-sm ml-auto" onclick="closeControl()">
            <i class="fa-solid fa-trash mr-2"></i>清空记录
        </button>
    </div>
</div>

<!-- 平均负载图表 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center">
        <h3 class="font-medium text-gray-600">平均负载</h3>
        <div class="flex gap-2">
            <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(1,'getload')">昨天</button>
            <button class="px-3 py-1 text-xs rounded bg-blue-50 text-blue-600" onclick="Wday(0,'getload')">今天</button>
            <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(7,'getload')">7天</button>
            <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(30,'getload')">30天</button>
        </div>
    </div>
    <div class="p-5">
        <div id="getloadview" style="width:100%; height:300px;"></div>
    </div>
</div>

<!-- CPU 和内存图表 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    <!-- CPU -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center">
            <h3 class="font-medium text-gray-600">CPU 使用率</h3>
            <div class="flex gap-2">
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(1,'cpu')">昨天</button>
                <button class="px-3 py-1 text-xs rounded bg-blue-50 text-blue-600" onclick="Wday(0,'cpu')">今天</button>
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(7,'cpu')">7天</button>
            </div>
        </div>
        <div class="p-5">
            <div id="cupview" style="width:100%; height:300px;"></div>
        </div>
    </div>
    
    <!-- 内存 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center">
            <h3 class="font-medium text-gray-600">内存使用率</h3>
            <div class="flex gap-2">
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(1,'mem')">昨天</button>
                <button class="px-3 py-1 text-xs rounded bg-blue-50 text-blue-600" onclick="Wday(0,'mem')">今天</button>
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(7,'mem')">7天</button>
            </div>
        </div>
        <div class="p-5">
            <div id="memview" style="width:100%; height:300px;"></div>
        </div>
    </div>
</div>

<!-- 磁盘IO 和 网络IO 图表 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- 磁盘IO -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center">
            <h3 class="font-medium text-gray-600">磁盘 IO</h3>
            <div class="flex gap-2">
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(1,'disk')">昨天</button>
                <button class="px-3 py-1 text-xs rounded bg-blue-50 text-blue-600" onclick="Wday(0,'disk')">今天</button>
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(7,'disk')">7天</button>
            </div>
        </div>
        <div class="p-5">
            <div id="diskview" style="width:100%; height:300px;"></div>
        </div>
    </div>
    
    <!-- 网络IO -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center">
            <h3 class="font-medium text-gray-600">网络 IO</h3>
            <div class="flex gap-2">
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(1,'network')">昨天</button>
                <button class="px-3 py-1 text-xs rounded bg-blue-50 text-blue-600" onclick="Wday(0,'network')">今天</button>
                <button class="px-3 py-1 text-xs rounded bg-gray-100 hover:bg-gray-200 text-gray-600" onclick="Wday(7,'network')">7天</button>
            </div>
        </div>
        <div class="p-5">
            <div id="network" style="width:100%; height:300px;"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="text/javascript" src="/static/laydate/laydate.js?v={{config.version}}"></script>
<script src="/static/app/control.js?v={{config.version}}"></script>
{% endblock %}
