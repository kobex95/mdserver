{% extends "layout.html" %}
{% block content %}

<!-- 状态卡片区域 -->
<section class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="px-5 py-3 border-b border-gray-100 text-gray-600 font-medium">状态</div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 divide-y md:divide-y-0 md:divide-x divide-gray-100">
        
        <!-- 负载状态 -->
        <div class="p-6 flex flex-col items-center justify-center">
            <div class="relative w-24 h-24 mb-2">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-gray-200 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                    <circle id="load-circle" class="text-green-500 progress-ring__circle stroke-current" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span class="text-xl font-bold text-green-600" id="Load">0</span>
                    <span class="text-xs text-gray-400">%</span>
                </div>
            </div>
            <div class="text-gray-500 text-sm mb-1">负载状态 <i class="fa-regular fa-circle-question text-gray-300 cursor-help" title="系统负载状态"></i></div>
            <div class="text-gray-400 text-xs" id="LoadState">获取中...</div>
        </div>

        <!-- CPU 使用率 -->
        <div class="p-6 flex flex-col items-center justify-center">
            <div class="relative w-24 h-24 mb-2">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-gray-200 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                    <circle id="cpu-circle" class="text-green-500 progress-ring__circle stroke-current" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span class="text-xl font-bold text-green-600" id="state">0</span>
                    <span class="text-xs text-gray-400">%</span>
                </div>
            </div>
            <div class="text-gray-500 text-sm mb-1">CPU使用率</div>
            <div class="text-gray-400 text-xs" id="core">获取中...</div>
        </div>

        <!-- 内存使用率 -->
        <div class="p-6 flex flex-col items-center justify-center">
            <div class="relative w-24 h-24 mb-2">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-gray-200 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                    <circle id="mem-circle" class="text-green-500 progress-ring__circle stroke-current" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span class="text-xl font-bold text-green-600" id="left">0</span>
                    <span class="text-xs text-gray-400">%</span>
                </div>
            </div>
            <div class="text-gray-500 text-sm mb-1">内存使用率</div>
            <div class="text-gray-400 text-xs" id="memory">获取中...</div>
        </div>

        <!-- 磁盘使用率 -->
        <div class="p-6 flex flex-col items-center justify-center">
            <div class="relative w-24 h-24 mb-2">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-gray-200 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                    <circle id="disk-circle" class="text-green-500 progress-ring__circle stroke-current" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span class="text-xl font-bold text-green-600" id="disk-percent">0</span>
                    <span class="text-xs text-gray-400">%</span>
                </div>
            </div>
            <div class="text-gray-500 text-sm mb-1">/</div>
            <div class="text-gray-400 text-xs" id="disk-info">获取中...</div>
        </div>
    </div>
</section>

<!-- 概览区域 -->
<section class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="px-5 py-3 border-b border-gray-100 text-gray-600 font-medium">概览</div>
    <div class="p-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-gray-50 p-4 rounded border border-gray-100 text-center hover:shadow-md transition-shadow cursor-pointer" onclick="location.href='/site/index'">
                <div class="text-gray-500 text-sm mb-1">网站</div>
                <div class="text-3xl font-light text-green-600">{{data['site_count']}}</div>
            </div>
            <div class="bg-gray-50 p-4 rounded border border-gray-100 text-center hover:shadow-md transition-shadow cursor-pointer" onclick="location.href='/soft/index'">
                <div class="text-gray-500 text-sm mb-1">已安装软件</div>
                <div class="text-3xl font-light text-blue-600" id="soft-count">0</div>
            </div>
            <div class="bg-gray-50 p-4 rounded border border-gray-100 text-center hover:shadow-md transition-shadow cursor-pointer" onclick="location.href='/firewall/index'">
                <div class="text-gray-500 text-sm mb-1">防火墙</div>
                <div class="text-3xl font-light text-orange-600" id="firewall-status">--</div>
            </div>
            <div class="bg-gray-50 p-4 rounded border border-gray-100 text-center hover:shadow-md transition-shadow cursor-pointer" onclick="location.href='/crontab/index'">
                <div class="text-gray-500 text-sm mb-1">计划任务</div>
                <div class="text-3xl font-light text-purple-600" id="crontab-count">0</div>
            </div>
        </div>
    </div>
</section>

<!-- 底部两栏布局：软件 & 流量 -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- 左侧：软件管理 -->
    <section class="bg-white rounded-lg shadow-sm border border-gray-200 lg:col-span-1">
        <div class="px-5 py-3 border-b border-gray-100 text-gray-600 font-medium flex justify-between items-center">
            <span>软件</span>
            <a href="/soft/index" class="text-xs text-blue-500 hover:underline">查看全部</a>
        </div>
        <div class="p-4">
            <div class="grid grid-cols-2 gap-4" id="index-soft">
                <!-- 软件卡片将通过 JS 动态加载 -->
            </div>
        </div>
    </section>

    <!-- 右侧：流量监控 -->
    <section class="bg-white rounded-lg shadow-sm border border-gray-200 lg:col-span-2 flex flex-col">
        <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center">
            <div class="flex gap-6 tabs">
                <div class="tab-item active" data-tab="traffic">流量</div>
                <div class="tab-item" data-tab="diskio">磁盘IO</div>
            </div>
            <div class="text-xs text-gray-500 border border-gray-200 rounded px-2 py-1 cursor-pointer hover:bg-gray-50">
                <select id="network-interface" class="bg-transparent border-none outline-none text-xs">
                    <option value="ALL">全部</option>
                </select>
            </div>
        </div>
        
        <div class="p-5 flex-1 flex flex-col">
            <!-- 流量数据 -->
            <div class="tab-content active" id="traffic-content">
                <div class="flex justify-between mb-4 text-sm flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
                        <span class="text-gray-500">上行</span>
                        <span class="font-mono text-gray-700 ml-1" id="upSpeed">0 B</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                        <span class="text-gray-500">下行</span>
                        <span class="font-mono text-gray-700 ml-1" id="downSpeed">0 B</span>
                    </div>
                    <div class="text-gray-500">
                        总发送 <span class="font-mono text-gray-700 ml-1" id="upAll">0 B</span>
                    </div>
                    <div class="text-gray-500">
                        总接收 <span class="font-mono text-gray-700 ml-1" id="downAll">0 B</span>
                    </div>
                </div>
                <div id="trafficChart" class="w-full h-64"></div>
            </div>
            
            <!-- 磁盘IO数据 -->
            <div class="tab-content hidden" id="diskio-content">
                <div class="flex justify-between mb-4 text-sm flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-400"></span>
                        <span class="text-gray-500">读取</span>
                        <span class="font-mono text-gray-700 ml-1" id="readBytes">0 B</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-400"></span>
                        <span class="text-gray-500">写入</span>
                        <span class="font-mono text-gray-700 ml-1" id="writeBytes">0 B</span>
                    </div>
                    <div class="text-gray-500">
                        每秒读写 <span class="font-mono text-gray-700 ml-1" id="diskIops">0</span>
                    </div>
                    <div class="text-gray-500">
                        IO延迟 <span class="font-mono text-green-600 ml-1" id="diskTime">0</span>
                    </div>
                </div>
                <div id="diskioChart" class="w-full h-64"></div>
            </div>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script type="text/javascript" src="/static/app/site.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/app/soft.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/app/index.js?v={{config.version}}"></script>
<script type="text/javascript">
// 标签页切换
$('.tab-item').click(function() {
    var tab = $(this).data('tab');
    $('.tab-item').removeClass('active');
    $(this).addClass('active');
    $('.tab-content').addClass('hidden');
    $('#' + tab + '-content').removeClass('hidden');
    
    if (tab === 'diskio') {
        diskioChart && diskioChart.resize();
    } else {
        trafficChart && trafficChart.resize();
    }
});

// 更新圆环进度条
function updateCircle(id, percent) {
    var circle = document.getElementById(id);
    if (!circle) return;
    
    var offset = 251.2 - (251.2 * percent / 100);
    circle.style.strokeDashoffset = offset;
    
    // 根据百分比改变颜色
    if (percent >= 80) {
        circle.classList.remove('text-green-500', 'text-yellow-500');
        circle.classList.add('text-red-500');
    } else if (percent >= 60) {
        circle.classList.remove('text-green-500', 'text-red-500');
        circle.classList.add('text-yellow-500');
    } else {
        circle.classList.remove('text-red-500', 'text-yellow-500');
        circle.classList.add('text-green-500');
    }
}

// 初始化流量图表
var trafficChart = echarts.init(document.getElementById('trafficChart'));
var trafficOption = {
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
    xAxis: {
        type: 'category',
        boundaryGap: false,
        data: [],
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: '#9ca3af', fontSize: 12 }
    },
    yAxis: {
        type: 'value',
        name: 'KB/s',
        nameTextStyle: { color: '#9ca3af', fontSize: 12, padding: [0, 0, 0, 40] },
        splitLine: { lineStyle: { color: '#f3f4f6', type: 'dashed' } },
        axisLabel: { color: '#9ca3af', fontSize: 12 }
    },
    series: [
        {
            name: '上行',
            type: 'line',
            smooth: true,
            symbol: 'none',
            lineStyle: { width: 2, color: '#facc15' },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: 'rgba(250, 204, 21, 0.3)' },
                    { offset: 1, color: 'rgba(250, 204, 21, 0.0)' }
                ])
            },
            data: []
        },
        {
            name: '下行',
            type: 'line',
            smooth: true,
            symbol: 'none',
            lineStyle: { width: 2, color: '#60a5fa' },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: 'rgba(96, 165, 250, 0.3)' },
                    { offset: 1, color: 'rgba(96, 165, 250, 0.05)' }
                ])
            },
            data: []
        }
    ]
};
trafficChart.setOption(trafficOption);

// 初始化磁盘IO图表
var diskioChart = echarts.init(document.getElementById('diskioChart'));
var diskioOption = {
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
    xAxis: {
        type: 'category',
        boundaryGap: false,
        data: [],
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: '#9ca3af', fontSize: 12 }
    },
    yAxis: {
        type: 'value',
        name: 'MB/s',
        nameTextStyle: { color: '#9ca3af', fontSize: 12, padding: [0, 0, 0, 40] },
        splitLine: { lineStyle: { color: '#f3f4f6', type: 'dashed' } },
        axisLabel: { color: '#9ca3af', fontSize: 12 }
    },
    series: [
        {
            name: '读取',
            type: 'line',
            smooth: true,
            symbol: 'none',
            lineStyle: { width: 2, color: '#22c55e' },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: 'rgba(34, 197, 94, 0.3)' },
                    { offset: 1, color: 'rgba(34, 197, 94, 0.0)' }
                ])
            },
            data: []
        },
        {
            name: '写入',
            type: 'line',
            smooth: true,
            symbol: 'none',
            lineStyle: { width: 2, color: '#ef4444' },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: 'rgba(239, 68, 68, 0.3)' },
                    { offset: 1, color: 'rgba(239, 68, 68, 0.0)' }
                ])
            },
            data: []
        }
    ]
};
diskioChart.setOption(diskioOption);

// 响应式
window.addEventListener('resize', function() {
    trafficChart.resize();
    diskioChart.resize();
});

// 初始化
index.init();
pluginInit();
loadKeyDataCount();

setTimeout(function() { getDiskInfo(); }, 500);
setTimeout(function() { indexSoft(); }, 1000);
setTimeout(function() { getInfo(); }, 200);
</script>
{% endblock %}
