{% extends "layout.html" %}
{% block content %}

<!-- 页面标题 -->
<div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-semibold text-gray-800">系统安全</h1>
    <div class="relative">
        <input type="text" id="SearchValue" 
            class="input w-64 pl-10" 
            placeholder="搜索日志...">
        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
    </div>
</div>

<!-- 设置面板 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="p-5 flex flex-wrap items-center gap-6">
        <button class="btn btn-outline" onclick="sshMgr();">
            <i class="fa-solid fa-terminal mr-2"></i>SSH管理
        </button>
        
        <div class="flex items-center gap-3 border-l border-gray-200 pl-6">
            <span class="text-sm text-gray-600">SSH端口:</span>
            <input type="text" id="mstscPort" class="input w-20 text-center" value="22">
            <button class="btn btn-outline text-sm" onclick="mstsc($('#mstscPort').val())">更改</button>
        </div>
        
        <div class="flex items-center gap-3 border-l border-gray-200 pl-6">
            <span class="text-sm text-gray-600">启用禁ping</span>
            <div class="switch" id="is_ping"></div>
        </div>
        
        <div class="flex items-center gap-3 border-l border-gray-200 pl-6">
            <span class="text-sm text-gray-600">启用防火墙</span>
            <div class="switch" id="firewall_status"></div>
        </div>
        
        <div id="firewall_weblog" class="ml-auto text-sm text-gray-500"></div>
    </div>
</div>

<!-- 防火墙规则 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="px-5 py-3 border-b border-gray-100">
        <h3 class="font-medium text-gray-600">防火墙规则</h3>
    </div>
    
    <!-- 添加规则 -->
    <div class="p-5 border-b border-gray-100">
        <div class="flex flex-wrap items-center gap-3">
            <select id="firewalldType" class="input w-32">
                <option value="port">放行端口</option>
                <option value="address">屏蔽IP</option>
            </select>
            <input type="text" id="AcceptPort" class="input w-32" placeholder="端口/IP">
            <input type="text" id="Ps" class="input w-40" placeholder="备注说明">
            <select class="input w-28" name="protocol">
                <option value="tcp">TCP</option>
                <option value="udp">UDP</option>
                <option value="tcp/udp">TCP/UDP</option>
            </select>
            <button class="btn btn-success" onclick="addAcceptPort();">
                <i class="fa-solid fa-plus mr-2"></i>添加
            </button>
        </div>
        <p class="text-xs text-gray-500 mt-2">提示: 支持端口范围，如 3000:3500</p>
    </div>
    
    <!-- 规则列表 -->
    <div class="overflow-x-auto">
        <table class="data-table">
            <thead>
                <tr>
                    <th>端口/地址</th>
                    <th>协议</th>
                    <th>策略</th>
                    <th>备注</th>
                    <th class="text-right">操作</th>
                </tr>
            </thead>
            <tbody id="firewall_body">
                <!-- 动态加载 -->
            </tbody>
        </table>
    </div>
    
    <!-- 分页 -->
    <div class="px-5 py-4 border-t border-gray-100 flex justify-between items-center">
        <div class="text-sm text-gray-500">共 <span id="firewall-count">0</span> 条规则</div>
        <div id="firewall_page" class="flex gap-1"></div>
    </div>
</div>

<script src="/static/app/firewall.js?v={{config.version}}"></script>
{% endblock %}
