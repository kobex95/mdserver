{% extends "layout.html" %}
{% block content %}

<!-- 文件管理工具栏 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-4 sticky top-0 z-10">
    <!-- 路径栏 -->
    <div class="p-4 border-b border-gray-100">
        <div class="flex items-center gap-3">
            <button id="backBtn" class="btn btn-outline w-10" onclick="backDir()" title="返回上级">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="btn btn-outline w-10" onclick="getFiles(getCookie('open_dir_path'))" title="刷新">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <div class="flex-1 flex items-center bg-gray-50 rounded-lg border border-gray-200">
                <input id="fileInputPath" type="text" class="flex-1 bg-transparent border-none px-4 py-2 text-sm focus:outline-none">
                <span id="PathPlaceBtn" class="flex items-center gap-1 px-2"></span>
            </div>
            <div class="text-sm text-gray-500" id="dir_info"></div>
        </div>
    </div>
    
    <!-- 操作按钮 -->
    <div class="p-4 flex items-center gap-3">
        <button class="btn btn-primary" onclick="uploadFiles()">
            <i class="fa-solid fa-upload mr-2"></i>上传
        </button>
        <button class="btn btn-outline" onclick="downloadFile()">
            <i class="fa-solid fa-download mr-2"></i>远程下载
        </button>
        <span id="BarTools" class="flex gap-2"></span>
        <span id="Batch" class="flex gap-2 ml-auto"></span>
        
        <!-- 视图切换 -->
        <div class="flex border border-gray-200 rounded-lg overflow-hidden">
            <button id="set_icon" class="px-3 py-2 hover:bg-gray-50" title="图标视图">
                <i class="fa-solid fa-grid-2 text-gray-500"></i>
            </button>
            <button id="set_list" class="px-3 py-2 bg-blue-50 text-blue-600" title="列表视图">
                <i class="fa-solid fa-list text-blue-600"></i>
            </button>
        </div>
        
        <!-- 搜索 -->
        <div class="relative">
            <input type="text" id="search_file" 
                class="input w-48 pl-10 text-sm" 
                placeholder="搜索文件...">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
    </div>
</div>

<!-- 文件列表 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div id="fileCon" class="p-4">
        <!-- 动态加载 -->
    </div>
    
    <!-- 分页 -->
    <div class="px-5 py-4 border-t border-gray-100 flex justify-between items-center">
        <div class="text-sm text-gray-500" id="file-info"></div>
        <div id="filePage" class="flex gap-1"></div>
    </div>
</div>

<!-- 右键菜单 -->
<ul id="rmenu" class="fixed bg-white rounded-lg shadow-lg border border-gray-200 py-2 hidden z-50 min-w-40">
    <li class="px-4 py-2 hover:bg-gray-50 cursor-pointer text-sm" onclick="batch(1);">
        <i class="fa-solid fa-copy mr-2 text-gray-400"></i>复制
    </li>
    <li class="px-4 py-2 hover:bg-gray-50 cursor-pointer text-sm" onclick="batch(2);">
        <i class="fa-solid fa-scissors mr-2 text-gray-400"></i>剪切
    </li>
    <li class="px-4 py-2 hover:bg-gray-50 cursor-pointer text-sm" onclick="batch(3);">
        <i class="fa-solid fa-lock mr-2 text-gray-400"></i>权限
    </li>
    <li class="px-4 py-2 hover:bg-gray-50 cursor-pointer text-sm" onclick="batch(5);">
        <i class="fa-solid fa-file-zipper mr-2 text-gray-400"></i>压缩
    </li>
    <li class="px-4 py-2 hover:bg-red-50 cursor-pointer text-sm text-red-500" onclick="batch(4);">
        <i class="fa-solid fa-trash mr-2"></i>删除
    </li>
</ul>
{% endblock %}

{% block scripts %}
<script src="/static/app/files.js?v={{config.version}}"></script>
<script src="/static/js/jquery-ui.min.js?v={{config.version}}"></script>
<script src="/static/js/jquery.contextify.min.js?v={{config.version}}"></script>
<script>
// 搜索
$("#search_file").focus().keyup(function(e){
    if(e.keyCode == 13) searchFile(1);
});

// 初始化
setTimeout(function() { getDisk(); }, 500);

var xPath = getCookie('open_dir_path');
setTimeout(function() {
    getFiles((xPath != undefined ? xPath : '/www/wwwroot'));
}, 800);

pathPlaceBtn((xPath != undefined ? xPath : '/www/wwwroot'));
setCookie('uploadSize', 1024 * 1024 * 1024);

if (getCookie('rank') == undefined || getCookie('rank') == null) {
    setCookie('rank', 'a');
}

// 视图切换
$("#set_icon").click(function() {
    setCookie('rank', 'b');
    $(this).addClass("bg-blue-50").removeClass("hover:bg-gray-50");
    $("#set_list").removeClass("bg-blue-50 text-blue-600").addClass("hover:bg-gray-50");
    getFiles(getCookie('open_dir_path'));
});

$("#set_list").click(function() {
    setCookie('rank', 'a');
    $(this).addClass("bg-blue-50 text-blue-600").removeClass("hover:bg-gray-50");
    $("#set_icon").removeClass("bg-blue-50").addClass("hover:bg-gray-50");
    getFiles(getCookie('open_dir_path'));
});
</script>
{% endblock %}
