<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nginx管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #009688;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .status.running {
            background: #d4edda;
            color: #155724;
        }
        .status.stopped {
            background: #f8d7da;
            color: #721c24;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #009688;
            color: white;
        }
        .btn-primary:hover {
            background: #00796b;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-warning {
            background: #ffc107;
            color: #212529;
        }
        .btn-warning:hover {
            background: #e0a800;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .info-card {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .info-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .info-card p {
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }
        .log-area {
            margin-top: 30px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 6px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nginx 管理</h1>
        
        <div class="status-bar">
            <span>运行状态:</span>
            <span id="status" class="status stopped">获取中...</span>
            <span id="version" style="color: #666; margin-left: auto;"></span>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" onclick="startNginx()">启动</button>
            <button class="btn btn-danger" onclick="stopNginx()">停止</button>
            <button class="btn btn-warning" onclick="restartNginx()">重启</button>
            <button class="btn btn-primary" onclick="reloadNginx()">重载配置</button>
        </div>
        
        <div class="info-grid">
            <div class="info-card">
                <h3>Worker Processes</h3>
                <p id="worker_processes">-</p>
            </div>
            <div class="info-card">
                <h3>Worker Connections</h3>
                <p id="worker_connections">-</p>
            </div>
        </div>
        
        <div class="log-area" id="log">
            等待操作...
        </div>
    </div>

    <script src="/static/js/jquery.min.js"></script>
    <script>
        // 获取Nginx信息
        function getInfo() {
            $.post('/plugins/run', {name:'nginx', func:'runInfo'}, function(data) {
                try {
                    var rdata = JSON.parse(data);
                    if (rdata.status) {
                        $('#status').text('运行中').removeClass('stopped').addClass('running');
                    } else {
                        $('#status').text('已停止').removeClass('running').addClass('stopped');
                    }
                    $('#version').text('版本: ' + (rdata.version || 'Unknown'));
                    $('#worker_processes').text(rdata.worker_processes || 'auto');
                    $('#worker_connections').text(rdata.worker_connections || '-');
                } catch(e) {
                    console.error(e);
                }
            });
        }

        // 启动Nginx
        function startNginx() {
            addLog('正在启动 Nginx...');
            $.post('/plugins/run', {name:'nginx', func:'start'}, function(data) {
                addLog(data);
                getInfo();
            });
        }

        // 停止Nginx
        function stopNginx() {
            addLog('正在停止 Nginx...');
            $.post('/plugins/run', {name:'nginx', func:'stop'}, function(data) {
                addLog(data);
                getInfo();
            });
        }

        // 重启Nginx
        function restartNginx() {
            addLog('正在重启 Nginx...');
            $.post('/plugins/run', {name:'nginx', func:'restart'}, function(data) {
                addLog(data);
                getInfo();
            });
        }

        // 重载配置
        function reloadNginx() {
            addLog('正在重载 Nginx 配置...');
            $.post('/plugins/run', {name:'nginx', func:'reload'}, function(data) {
                addLog(data);
                getInfo();
            });
        }

        // 添加日志
        function addLog(msg) {
            var time = new Date().toLocaleTimeString();
            $('#log').prepend('[' + time + '] ' + msg + '\n');
        }

        // 页面加载完成后获取信息
        $(function() {
            getInfo();
        });
    </script>
</body>
</html>
